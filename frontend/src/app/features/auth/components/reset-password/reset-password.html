<div class="max-w-md mx-auto mt-10">
  <h1 class="text-2xl font-bold mb-6">Reset Password</h1>

  @if (isCheckingToken()) {
    <p>Checking reset link...</p>
  } @else if (!isTokenValid()) {
    <p class="text-error">{{ errorMessage() }}</p>
  } @else {
    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
      <div>
        <label class="label">New Password</label>
        <input type="password" formControlName="password" class="input input-bordered w-full" />
      </div>

      <div>
        <label class="label">Confirm Password</label>
        <input type="password" formControlName="confirmPassword" class="input input-bordered w-full" />
      </div>

      @if (errorMessage()) {
        <p class="text-error">{{ errorMessage() }}</p>
      }

      <button type="submit" class="btn btn-primary" [disabled]="resetForm.invalid">
        Reset Password
      </button>
    </form>
  }
</div>
