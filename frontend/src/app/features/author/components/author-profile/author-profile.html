<div class="max-w-2xl mx-auto mt-10 px-4">
  @if (author(); as a) {
    <div class="flex items-center gap-4">
      @if (a.avatarUrl) {
        <img [src]="a.avatarUrl" [alt]="a.username" class="w-24 h-24 rounded-full object-cover" />
      } @else {
        <div class="w-24 h-24 rounded-full bg-base-300 flex items-center justify-center text-2xl font-bold">
          {{ a.username.charAt(0).toUpperCase() }}
        </div>
      }
      <div>
        <h1 class="text-2xl font-bold">{{ a.username }}</h1>
      </div>
    </div>

    @if (a.bio) {
      <p class="mt-6 text-base-content/80">{{ a.bio }}</p>
    } @else {
      <p class="mt-6 text-base-content/50 italic">This author hasn't written a bio yet.</p>
    }
  } @else {
    <p>Loading...</p>
  }
</div>
