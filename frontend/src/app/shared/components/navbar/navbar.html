<div class="navbar bg-base-100 shadow-sm px-4">
  <div class="navbar-start">
    <a routerLink="/" class="btn btn-ghost text-xl">GameAssets</a>
  </div>

  <div class="navbar-center hidden md:flex gap-2">
    <a routerLink="/assets" class="btn btn-ghost">Assets</a>

    @if (isAuthenticated() && (user()?.userRole === 'author' || user()?.userRole === 'admin')) {
      <a routerLink="/author/dashboard" class="btn btn-ghost">Author Dashboard</a>
    } @else {
      <button class="btn btn-ghost" (click)="onAuthorClick()">Become an Author</button>
    }
  </div>

  <div class="navbar-end gap-2">
    @if (isAuthenticated()) {
      <span class="text-sm">Hi, {{ user()?.username }}</span>
      <button class="btn btn-ghost" (click)="onLogout()">Logout</button>
    } @else {
      <a routerLink="/auth/login" class="btn btn-ghost">Login</a>
      <a routerLink="/auth/register" class="btn btn-primary">Register</a>
    }
  </div>
</div>
